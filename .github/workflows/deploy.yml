name: Deploy Worker

on:
  push:
    branches:
      - master
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
      
      - name: Sanitize Secrets and Set Environment
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Strip any potential hidden newlines, carriage returns, or spaces
          CLEAN_TOKEN=$(echo -n "$RAW_TOKEN" | tr -d '[:space:]')
          CLEAN_ACCOUNT_ID=$(echo -n "$RAW_ACCOUNT_ID" | tr -d '[:space:]')
          
          # Export to GitHub ENV for all following steps
          echo "CLOUDFLARE_API_TOKEN=$CLEAN_TOKEN" >> $GITHUB_ENV
          echo "CLOUDFLARE_ACCOUNT_ID=$CLEAN_ACCOUNT_ID" >> $GITHUB_ENV

      - name: Deploy to Cloudflare
        run: npx wrangler deploy

      - name: Sync Secrets
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OPS_ADMIN_PASSWORD: ${{ secrets.OPS_ADMIN_PASSWORD }}
          OPS_JWT_SECRET: ${{ secrets.OPS_JWT_SECRET }}
          BACKBLAZE_B2_APP_KEY: ${{ secrets.BACKBLAZE_B2_APP_KEY }}
        run: |
          # Use jq to safely build a JSON object of all secrets, filtering out empty ones
          jq -n \
            --arg supabase "$SUPABASE_SECRET_KEY" \
            --arg resend "$RESEND_API_KEY" \
            --arg ops_pwd "$OPS_ADMIN_PASSWORD" \
            --arg ops_jwt "$OPS_JWT_SECRET" \
            --arg backblaze "$BACKBLAZE_B2_APP_KEY" \
            '{
              SUPABASE_SECRET_KEY: $supabase,
              RESEND_API_KEY: $resend,
              OPS_ADMIN_PASSWORD: $ops_pwd,
              OPS_JWT_SECRET: $ops_jwt,
              BACKBLAZE_B2_APP_KEY: $backblaze
            } | with_entries(select(.value != ""))' > secrets.json

          echo "Syncing all secrets in bulk..."
          npx wrangler secret bulk secrets.json
          
          # Clean up
          rm secrets.json
          echo "Secrets sync process completed."


