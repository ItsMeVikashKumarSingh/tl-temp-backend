name: Deploy Worker

on:
  push:
    branches:
      - master
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
      
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Sync Secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OPS_ADMIN_PASSWORD: ${{ secrets.OPS_ADMIN_PASSWORD }}
          OPS_JWT_SECRET: ${{ secrets.OPS_JWT_SECRET }}
          BACKBLAZE_B2_APP_KEY: ${{ secrets.BACKBLAZE_B2_APP_KEY }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare credentials missing. Skipping sync."
            exit 1
          fi
          
          # Function to sync a secret if it's not empty
          sync_secret() {
            local name=$1
            local value=$2
            if [ -n "$value" ]; then
              echo "Syncing $name..."
              echo "$value" | npx wrangler secret put "$name"
            else
              echo "Warning: $name is empty, skipping sync."
            fi
          }

          sync_secret "SUPABASE_SECRET_KEY" "$SUPABASE_SECRET_KEY"
          sync_secret "RESEND_API_KEY" "$RESEND_API_KEY"
          sync_secret "OPS_ADMIN_PASSWORD" "$OPS_ADMIN_PASSWORD"
          sync_secret "OPS_JWT_SECRET" "$OPS_JWT_SECRET"
          sync_secret "BACKBLAZE_B2_APP_KEY" "$BACKBLAZE_B2_APP_KEY"
          
          echo "Secrets sync process completed."
